zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e960332b3f6c46a1956486d4f3f99fce
      name: 'Templates/Server hardware'
  templates:
    - uuid: 8f5fd5102c044d02afbe0871e8989a4a
      template: 'MegaRAID controllers by Zabbix agent'
      name: 'MegaRAID controllers by Zabbix agent'
      description: 'MegaRAID monitoring for Windows using an active StorCLI JSON master item and dependent discovery.'
      vendor:
        name: Soft-Management
        version: 7.0-45
      groups:
        - name: 'Templates/Server hardware'
      items:
        - uuid: 6eec11d9ec074b3db72545189a7fecc2
          name: 'MegaRAID: StorCLI raw JSON'
          type: ZABBIX_ACTIVE
          key: megaraid.get
          delay: 5m
          history: 1d
          value_type: TEXT
          trends: '0'
          timeout: 30s
          tags:
            - tag: component
              value: raw
          triggers:
            - uuid: 92923dfd815b47bd826e2d1d91965c61
              expression: 'nodata(/MegaRAID controllers by Zabbix agent/megaraid.get,15m)=1'
              name: 'MegaRAID: No StorCLI data for 15 minutes'
              priority: AVERAGE
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: e3dca5922ac14a78a693459b84601b13
          name: 'MegaRAID: Normalized data'
          type: DEPENDENT
          key: megaraid.normalized
          delay: '0'
          history: 1d
          value_type: TEXT
          trends: '0'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  value=value.replace(/^\uFEFF/,"");
                  var s=JSON.parse(value),o={controllers:[],virtual_drives:[],physical_drives:[]};
                  var A=s.Controllers||[];
                   for(var i=0;i<A.length;i++){
                   var c=A[i]||{},cmd=c["Command Status"]||{},r=c["Response Data"]||{};
                   var b=r["Basics"]||{},v=r["Version"]||{},status=r["Status"]||{},hw=r["HwCfg"]||{};
                   var id=b.Controller;if(id===undefined||id===null)id=cmd.Controller;id=Number(id);
                    var st=String(status["Controller Status"]);
                   var temp=Number(hw["ROC temperature(Degree Celsius)"]);if(isNaN(temp))temp=0;
                    o.controllers.push({id:id,model:String(b.Model||""),serial:String(b["Serial Number"]||""),state:st,health:st==="Optimal"?0:1,temperature:temp});
                    var V=r["VD LIST"]||[];for(var j=0;j<V.length;j++){var q=V[j]||{},d=String(q["DG/VD"]||"").split("/");if(d.length!==2)continue;var  z=String(q.State||"Unknown"),h=z==="Optl"?0:(z==="Dgrd"?1:(z==="Pdgd"?2:(z==="Offln"?3:4)));o.virtual_drives.push({controller:id,dg:Number(d[0]),vd:Number(d[1]),type:String(q.TYPE||""),size:String(q.Size||""),name:String(q.Name||""),state:z,health:h,access:String(q.Access||"Unknown"),consistency:String(q.Consist||"Unknown"),cache:String(q.Cache||"Unknown")});}
                   var physicalDrives=r["PD LIST"]||[];
                   for(var pdIndex=0;pdIndex<physicalDrives.length;pdIndex++){
                     var physicalDrive=physicalDrives[pdIndex]||{};
                    var eidSlot=String(physicalDrive["EID:Slt"]||"").split(":");
                    if(eidSlot.length!==2)continue;
                     var pdState=String(physicalDrive["State"]||"Unknown");
                    var pdHealth=4;
                    if(pdState==="Onln"||pdState==="DHS"||pdState==="GHS")pdHealth=0;
                    else if(pdState==="Rbld")pdHealth=1;
                    else if(pdState==="Offln"||pdState==="UBad"||pdState==="Msng"||pdState==="Failed")pdHealth=2;
                    else if(pdState==="UGood"||pdState==="JBOD")pdHealth=3;
                    o.physical_drives.push({controller:id,eid:Number(eidSlot[0]),slot:Number(eidSlot[1]),did:Number(physicalDrive["DID"]),model:String(physicalDrive["Model"]||"").replace(/^\s+|\s+$/g,""),interface:String(physicalDrive["Intf"]||""),media:String(physicalDrive["Med"]||""),size:String(physicalDrive["Size"]||""),dg:String(physicalDrive["DG"]),state:pdState,health:pdHealth});
                   }
                  }
                   return JSON.stringify(o);
          master_item:
            key: megaraid.get
          tags:
            - tag: component
              value: raw
      discovery_rules:
        - uuid: 412fd56f424d41d389f78f007ad82534
          name: 'MegaRAID: Controller discovery'
          type: DEPENDENT
          key: megaraid.controller.discovery
          delay: '0'
          item_prototypes:
            - uuid: 80d61612bb9b431f993c2c118bffa862
              name: 'MegaRAID Controller {#CTRL}'
              type: DEPENDENT
              key: 'megaraid.controller.model[{#CTRL}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.controllers[?(@.id == {#CTRL})].model.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: megaraid.normalized
              tags:
                - tag: component
                  value: megaraid
            - uuid: 87ab2f6a274341bcbffb7797c14044d8
              name: 'MegaRAID C{#CTRL}: BIOS version'
              type: DEPENDENT
              key: 'megaraid.controller.bios.version[{#CTRL}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      value=value.replace(/^\uFEFF/,"");
                      var data=JSON.parse(value);
                      var controllers=data["Controllers"]||[];
                      for(var i=0;i<controllers.length;i++){
                         var response=controllers[i]["Response Data"]||{};
                        var basics=response["Basics"]||{};
                        if(Number(basics["Controller"])===Number("{#CTRL}")){
                          var version=response["Version"]||{};
                          return version["Bios Version"];
                        }
                      }
                      throw "Controller  {#CTRL} or field Bios Version not found";
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: megaraid.get
              tags:
                - tag: component
                  value: megaraid
            - uuid: e9ff5e59280e47118caf1a0de873506f
